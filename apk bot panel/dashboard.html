<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GHOST X SERVER | Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;family=Anybody:wght@700;900&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "background": "#10131a",
                        "surface": "#10131a",
                        "surface-container-low": "#191c23",
                        "surface-container-highest": "#32353c",
                        "primary": "#ffb4a8",
                        "primary-container": "#ff5540",
                        "on-primary-container": "#5c0000",
                        "on-surface": "#e0e2ec",
                        "on-surface-variant": "#ebbbb4",
                        "on-secondary-container": "#b4b5b5",
                        "outline-variant": "#603e39"
                    },
                    "borderRadius": {
                        "DEFAULT": "0px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "container-padding": "24px"
                    },
                    "fontFamily": {
                        "label-caps": ["Space Grotesk"],
                        "headline-md": ["Anybody"],
                        "headline-lg": ["Anybody"],
                        "body-sm": ["JetBrains Mono"],
                        "body-lg": ["JetBrains Mono"]
                    }
                },
            },
        }
    </script>
<style>
        .scanline-bg {
            background: linear-gradient(rgba(18, 21, 28, 0) 50%, rgba(255, 255, 255, 0.02) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.01), rgba(0, 0, 0, 0));
            background-size: 100% 4px, 100% 100%;
        }
        .red-glow {
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.2);
        }
        .active-glow {
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.4);
        }
    </style>
</head>
<body class="bg-background text-on-surface h-screen overflow-hidden flex flex-col font-body-lg text-body-lg">
<!-- Main Content -->
<main class="flex-grow flex flex-col items-center justify-center px-gutter max-w-lg mx-auto w-full py-4">
<!-- Profile/Logo Section -->
<div class="mb-4 relative group">
<div class="absolute -inset-1 bg-primary blur-xl opacity-20 group-hover:opacity-40 transition-opacity"></div>
<img alt="Ghost X Server Branding" class="relative w-24 h-24 rounded-full border-2 border-primary-container object-cover" src="logo.png"/>
</div>
<!-- Branding Header -->
<div class="text-center mb-4">
<h2 class="font-headline-lg-mobile text-2xl text-on-surface uppercase mb-1 tracking-tighter">GHOST X SERVER</h2>
<div class="space-y-0.5">
<p class="text-[9px] font-label-caps text-on-surface-variant uppercase">Premium Server Access Guaranteed</p>
<p class="text-[9px] font-label-caps text-[#FFD700] uppercase italic">Bypass Protection &amp; Dominate</p>
</div>
</div>
<!-- Dashboard Action Card -->
<section class="w-full bg-surface-container-low border border-white/10 p-4 relative overflow-hidden red-glow scanline-bg mb-4">
<!-- ID Tag decoration -->
<div class="absolute top-0 left-0 bg-primary-container px-2 py-0.5">
<span class="font-label-caps text-[8px] text-on-primary-container uppercase">System_v4.2</span>
</div>
<div class="mt-2 space-y-4">
<!-- License Key -->
<div class="space-y-1">
<label class="text-[10px] font-label-caps text-on-secondary-container">YOUR KEY</label>
<div class="bg-surface-container-lowest p-3 border-b-2 border-primary-container">
<span id="key_display" class="text-lg font-bold tracking-widest text-on-surface">123</span>
</div>
</div>
<!-- Expiry Timer -->
<div class="space-y-1">
<label class="text-[10px] font-label-caps text-on-secondary-container">LICENSE EXPIRY</label>
<div id="expiry_display" class="text-primary text-3xl font-bold leading-none tracking-tight">
                        239:59:47
                    </div>
</div>
<!-- Launch Button -->
<button onclick="Android.launchController()" class="w-full py-3 bg-primary-container text-white text-lg font-black uppercase text-center active:scale-95 transition-all active-glow hover:brightness-110">
                    LAUNCH FLOATING CONTROLLER
                </button>
</div>
</section>
<!-- Technical Stats Grid -->
<div class="grid grid-cols-2 gap-3 w-full">
<div class="p-3 bg-surface-container-highest/50 border border-white/5">
<div class="flex justify-between items-start mb-1">
<span class="material-symbols-outlined text-primary text-xs" data-icon="dns">dns</span>
<span class="text-[8px] font-label-caps text-green-500">STABLE</span>
</div>
<div class="text-[9px] font-label-caps text-on-secondary-container">SERVER PING</div>
<div class="text-sm font-bold text-primary">12ms</div>
</div>
<div class="p-3 bg-surface-container-highest/50 border border-white/5">
<div class="flex justify-between items-start mb-1">
<span class="material-symbols-outlined text-primary text-xs" data-icon="security" style="font-variation-settings: 'FILL' 1;">security</span>
<span class="text-[8px] font-label-caps text-primary">SECURED</span>
</div>
<div class="text-[9px] font-label-caps text-on-secondary-container">BYPASS STATUS</div>
<div class="text-sm font-bold text-primary">ENCRYPTED</div>
</div>
</div>
<!-- Forced Telegram Join Popup -->
<div id="tg_popup" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden">
    <div class="bg-surface-container-low border border-white/10 p-6 max-w-sm w-full mx-4 red-glow scanline-bg relative">
        <div class="text-center">
            <!-- Icon -->
            <div class="mb-4 text-primary-container">
                <span class="material-symbols-outlined text-6xl" style="font-variation-settings: 'FILL' 1;">send</span>
            </div>
            
            <h2 class="font-headline-lg-mobile text-2xl text-on-surface uppercase mb-2">Join Telegram</h2>
            <p class="text-sm text-on-surface-variant mb-6">Join our official channel to get the latest updates, methods, and support!</p>
            
            <!-- Join Button -->
            <button onclick="joinChannel()" class="w-full py-3 bg-primary-container text-white text-lg font-black uppercase text-center active:scale-95 transition-all active-glow hover:brightness-110 mb-3">
                JOIN CHANNEL
            </button>
            
            <!-- I have joined button -->
            <button onclick="markAsJoined()" class="w-full py-2 bg-transparent border border-white/20 text-on-surface text-sm font-bold uppercase text-center active:scale-95 transition-all">
                I HAVE JOINED
            </button>
        </div>
    </div>
</div>

<script>
    function checkTgJoin() {
        const joined = localStorage.getItem('tg_joined');
        if (!joined) {
            document.getElementById('tg_popup').classList.remove('hidden');
        }
    }
    
    function joinChannel() {
        // Open Telegram channel link
        window.open('https://t.me/+SrZrGWaRhds0OTE1', '_blank');
    }
    
    function markAsJoined() {
        localStorage.setItem('tg_joined', 'true');
        document.getElementById('tg_popup').classList.add('hidden');
    }
    
    // Run check after a small delay
    setTimeout(checkTgJoin, 1000);
</script>

</main>
</body></html>
