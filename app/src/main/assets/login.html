<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GHOST X SERVER - Authentication</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wght@700;900&amp;family=JetBrains+Mono:wght@400;700&amp;family=Space+Grotesk:wght@700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "background": "#10131a",
                        "surface": "#10131a",
                        "surface-container-low": "#12151C",
                        "surface-container-lowest": "#0b0e15",
                        "primary": "#ffb4a8",
                        "primary-container": "#ff5540",
                        "on-primary-container": "#5c0000",
                        "on-surface": "#e0e2ec",
                        "on-surface-variant": "#ebbbb4",
                        "outline-variant": "#603e39"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem"
                    },
                    "fontFamily": {
                        "label-caps": ["spaceGrotesk"],
                        "headline-md": ["anybody"],
                        "headline-lg": ["anybody"],
                        "body-sm": ["jetbrainsMono"],
                        "body-lg": ["jetbrainsMono"]
                    }
                },
            },
        }
    </script>
<style>
        body {
            background-color: #10131a;
            color: #e0e2ec;
            -webkit-font-smoothing: antialiased;
        }

        .scanline-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.05),
                rgba(0, 0, 0, 0.05) 1px,
                transparent 1px,
                transparent 4px
            );
            pointer-events: none;
            z-index: 100;
        }

        .red-glow-btn:hover {
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
        }

        .input-bottom-glow:focus {
            outline: none;
            border-bottom-color: #ff5540;
            box-shadow: 0 4px 12px -2px rgba(255, 85, 64, 0.2);
        }

        .card-brutalist {
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: linear-gradient(145deg, #12151C, #10131a);
        }

        /* Loading Spinner */
        .spinner {
            border: 2px solid rgba(255, 85, 64, 0.2);
            border-top: 2px solid #ff5540;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
<script>
        function showLoading() {
            const btn = document.getElementById('validate_btn');
            btn.innerHTML = '<div class="spinner"></div><span>VALIDATING...</span>';
            btn.disabled = true;
            btn.classList.add('opacity-75');
        }

        function hideLoading() {
            const btn = document.getElementById('validate_btn');
            btn.innerHTML = 'VALIDATE DEVICE <span class="material-symbols-outlined text-sm">arrow_forward</span>';
            btn.disabled = false;
            btn.classList.remove('opacity-75');
        }
    </script>
</head>
<body class="font-body-lg text-body-lg h-screen overflow-hidden">
<!-- Scanline Texture -->
<div class="scanline-overlay"></div>
<!-- Main Container -->
<main class="relative h-screen w-full flex flex-col items-center justify-center px-6 py-4 bg-surface">
<!-- Header Section -->
<header class="flex flex-col items-center mb-4 w-full">
<div class="relative w-32 h-32 mb-4 group">
<!-- Red ambient glow behind logo -->
<div class="absolute inset-0 bg-primary-container opacity-20 blur-3xl group-hover:opacity-40 transition-opacity duration-500"></div>
<img alt="GHOST X SERVER Brand Identity" class="relative z-10 w-full h-full object-contain drop-shadow-[0_0_15px_rgba(255,0,0,0.3)]" src="logo.png"/>
</div>
<h1 class="text-2xl text-primary tracking-tighter text-center uppercase font-bold">
                GHOST X SERVER
            </h1>
<p class="text-[9px] font-label-caps text-on-surface-variant mt-1 tracking-[0.3em]">
                Premium Device Authentication
            </p>
</header>
<!-- Activation Card -->
<section class="card-brutalist w-full max-w-md p-4 relative overflow-hidden">
<!-- ID Tag decoration -->
<div class="absolute top-0 left-0 bg-primary-container text-on-primary-container font-label-caps text-[8px] px-2 py-0.5 flex items-center gap-1">
<span class="material-symbols-outlined text-[10px]" style="font-variation-settings: 'FILL' 1;">security</span>
                SECURE ACCESS
            </div>
<div class="mt-2 mb-4">
<h2 class="text-lg font-bold text-on-surface mb-1">Activate Device</h2>
<p id="status_msg" class="text-xs text-on-surface-variant">
                    Enter your license key to gain server access.
                </p>
</div>
<!-- Form -->
<div class="space-y-4">
<div class="space-y-1">
<label class="text-[10px] font-label-caps text-on-surface-variant block ml-1" for="license-key">
                        LICENSE KEY
                    </label>
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-primary-container text-sm" data-icon="lock" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
<input class="w-full bg-surface-container-lowest border-0 border-b-2 border-outline-variant py-3 pl-10 pr-4 text-sm text-primary placeholder-on-surface-variant/30 input-bottom-glow transition-all duration-300" id="license-key" placeholder="•••• •••• •••• ••••" type="password"/>
</div>
</div>
<button id="validate_btn" onclick="showLoading(); Android.validateDevice(document.getElementById('license-key').value)" class="w-full py-3 bg-primary-container text-on-primary-container text-lg font-bold uppercase red-glow-btn transition-all duration-300 active:scale-95 flex items-center justify-center gap-2">
                    VALIDATE DEVICE
                    <span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</section>
<!-- Footer -->
<footer class="mt-6 text-center">
<a class="text-xs text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center gap-2" href="#">
                Don't have a key? 
                <span class="text-primary font-bold">Contact Reseller</span>
</a>
</footer>
</main>
</body></html>
